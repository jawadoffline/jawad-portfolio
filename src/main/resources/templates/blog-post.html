<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" id="top">
<head th:replace="~{fragments/layout :: head(${post.title + ' — Jawad Ali'}, ${post.description})}"></head>
<body>
<div th:replace="~{fragments/layout :: header('blog')}"></div>
<main id="main" class="container page-main article-main">
    <a class="back-link" href="/blog">← Back to the notebook</a>
    <header class="article-header">
        <h1 th:text="${post.title}"></h1>
        <div class="article-meta"><span th:text="${post.author}"></span><time th:datetime="${post.date}" th:text="${#temporals.format(post.date, 'dd MMMM yyyy')}"></time><span th:text="${post.readingTimeMinutes + ' min read'}"></span></div>
        <div class="post-tags"><span th:each="tag : ${post.tags}" th:text="${tag}"></span></div>
    </header>
    <article class="blog-content" th:utext="${post.htmlContent}"></article>
    <footer class="article-footer"><p>Written by <span th:text="${post.author}"></span><br>Software engineer · Trading &amp; real-time systems</p><a class="text-link" href="/blog">More from the notebook <span aria-hidden="true">↗</span></a></footer>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
