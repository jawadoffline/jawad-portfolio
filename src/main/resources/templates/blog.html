<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" id="top">
<head th:replace="~{fragments/layout :: head('Writing — Jawad Ali', 'Notes on Java, infrastructure, performance, and the things I learn by building software.')}"></head>
<body>
<div th:replace="~{fragments/layout :: header('blog')}"></div>
<main id="main" class="container page-main">
    <header class="page-heading"><p class="eyebrow">The notebook</p><h1>Notes from<br><em>the process.</em></h1><p>Things I’ve built, problems I’ve worked through, and the occasional useful discovery. Written down while they’re still fresh.</p></header>
    <div class="empty-state" th:if="${#lists.isEmpty(posts)}"><h2>A blank page, for now.</h2><p>New writing will appear here.</p></div>
    <div class="post-list" th:unless="${#lists.isEmpty(posts)}">
        <a class="post-link" th:each="post : ${posts}" th:href="@{'/blog/' + ${post.slug}}">
            <span class="post-date" th:text="${#temporals.format(post.date, 'dd MMM yyyy')}"></span>
            <div><h2 th:text="${post.title}"></h2><p th:text="${post.description}"></p><div class="post-tags"><span th:each="tag : ${post.tags}" th:text="${tag}"></span><span th:text="${post.readingTimeMinutes + ' min read'}"></span></div></div>
            <span class="post-arrow" aria-hidden="true">↗</span>
        </a>
    </div>
</main>
<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
