<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle, pageDescription)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Jawad Ali — Software Engineer</title>
    <meta name="description" th:content="${pageDescription}">
    <meta property="og:title" th:content="${pageTitle}">
    <meta property="og:description" th:content="${pageDescription}">
    <meta property="og:type" th:content="${post != null ? 'article' : 'website'}">
    <link rel="canonical" th:if="${post != null}" th:href="${'https://jawadali.dev' + collectionPath + '/' + post.slug}">
    <meta property="og:url" th:if="${post != null}" th:content="${'https://jawadali.dev' + collectionPath + '/' + post.slug}">
    <meta property="article:published_time" th:if="${post != null and post.date != null}" th:content="${post.date}">
    <meta property="og:image" content="https://jawadali.dev/images/jawad.jpeg">
    <meta name="theme-color" content="#f4f1ea">
    <link rel="icon" th:href="@{/images/favicon.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,450;0,500;1,400;1,450&display=swap" rel="stylesheet">
    <script>try { if (localStorage.getItem('portfolio-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (_) {}</script>
    <link rel="stylesheet" th:href="@{/css/styles.css(v=4)}">
    <script th:src="@{/js/main.js(v=2)}" defer></script>
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body>
<header class="site-header" th:fragment="header(activePage)">
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="container header-inner">
        <a class="wordmark" href="/" aria-label="Jawad Ali — home">jawad ali<span>.</span></a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-menu-toggle>Menu <span aria-hidden="true">+</span></button>
        <nav id="site-nav" class="site-nav" aria-label="Main navigation">
            <a href="/#work">Work</a>
            <a href="/#about">About</a>
            <a href="/writing" th:attr="aria-current=${activePage == 'writing' ? 'page' : null}">Writing</a>
            <a href="/tools" th:attr="aria-current=${activePage == 'tools' ? 'page' : null}">Tools</a>
            <a class="nav-contact" href="/#contact">Let’s talk <span aria-hidden="true">↗</span></a>
        </nav>
        <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme"><span class="theme-dot" aria-hidden="true"></span><span data-theme-label>Dark</span></button>
    </div>
</header>
<footer class="site-footer" th:fragment="footer">
    <div class="container footer-top">
        <a class="wordmark" href="/">jawad ali<span>.</span></a>
        <p>Thoughtfully built. Java underneath. <a href="/wheelogz">Wheelogz ↗</a></p>
        <a href="https://github.com/jawadoffline/jawad-portfolio" target="_blank" rel="noopener noreferrer">View the source <span aria-hidden="true">↗</span></a>
    </div>
    <div class="container footer-bottom">
        <span>© <span th:text="${#temporals.year(#temporals.createNow())}">2026</span> Jawad Ali</span>
        <div class="footer-stats"><span><span id="visitor-count">1</span> here now</span><span><span id="total-visits">—</span> visits</span></div>
        <a href="#top">Back to top ↑</a>
    </div>
</footer>
</body>
</html>
